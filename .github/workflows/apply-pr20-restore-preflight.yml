name: Apply PR 20 snapshot restore preflight

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/apply-pr20-restore-preflight.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-restore-preflight
  cancel-in-progress: false

jobs:
  red-green-verify:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Verify the reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/threadweave/incremental.py)" = \
            '53c5aec50bf3411da7f1d8597de4a8f11239d1e4'
          test "$(git hash-object tests/test_incremental_snapshot.py)" = \
            '3179e044533e423c5fb4d55dfae66c2627df08f9'
          test "$(git hash-object docs/incremental-threading.md)" = \
            '35529ecc24de15386fe792175d4c17951c448b93'
          test "$(git hash-object README.md)" = \
            'b6d0c42f1a985a590993e46a4178224b2de71dc7'
          test "$(git hash-object CHANGELOG.md)" = \
            '3d43ba99b556161f124a9ea624e81ae76b8dc74b'

      - name: Prove bounds are checked too late before the fix
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import threadweave.incremental as incremental
          from threadweave import IncrementalThreadError, IncrementalThreadIndex

          oversized_records = {
              "schema_version": 1,
              "version": 0,
              "options": {
                  "group_by_subject": False,
                  "sort_by_sent_date": False,
              },
              "records": [object(), object()],
          }
          try:
              IncrementalThreadIndex.restore(
                  oversized_records,
                  max_snapshot_records=1,
                  max_snapshot_bytes=10_000,
              )
          except IncrementalThreadError as error:
              if "max_snapshot_records" in str(error):
                  raise SystemExit("record bound already runs before nested traversal")
          else:
              raise SystemExit("expected invalid nested records to fail")

          unknown_root = {
              "schema_version": 1,
              "version": 0,
              "options": {
                  "group_by_subject": False,
                  "sort_by_sent_date": False,
              },
              "records": [],
              "unexpected": [object()],
          }
          try:
              IncrementalThreadIndex.restore(unknown_root)
          except IncrementalThreadError as error:
              if "snapshot fields" in str(error):
                  raise SystemExit("root schema already runs before nested traversal")
          else:
              raise SystemExit("expected the unknown root field to fail")

          class ForbiddenEncoder:
              def __init__(self, **_options):
                  raise AssertionError("JSON encoder constructed before structural bound")

          incremental.json.JSONEncoder = ForbiddenEncoder
          structurally_oversized = {
              "schema_version": 1,
              "version": 0,
              "options": {
                  "group_by_subject": False,
                  "sort_by_sent_date": False,
              },
              "records": [None] * 100,
          }
          try:
              IncrementalThreadIndex.restore(
                  structurally_oversized,
                  max_snapshot_records=200,
                  max_snapshot_bytes=10,
              )
          except AssertionError:
              pass
          else:
              raise SystemExit("expected pre-fix JSON encoder construction")
          PYCODE
          echo 'Observed all three expected pre-fix boundary failures.' \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Apply the snapshot preflight patch
