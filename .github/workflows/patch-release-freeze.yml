name: Prepare release-freeze gate patch

on:
  push:
    branches: [ci/pause-development-for-release-blocker]
    paths: [.github/workflows/patch-release-freeze.yml]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/patch-release-freeze.yml
      - tests/test_workflows.py

permissions:
  contents: read

concurrency:
  group: prepare-release-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the exact tested gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          if [ "$open_prs" -ne 0 ]; then
            {
              echo "develop=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; the maintenance loop owns this hour." \\
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
          '''
          new = '''          if [ "$open_prs" -ne 0 ]; then
            {
              echo "develop=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; the maintenance loop owns this hour." \\
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_blockers="$(
            gh api \\
              "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=release-blocker&per_page=1" \\
              --jq '[.[] | select(.pull_request == null)] | length'
          )"
          if [ "$release_blockers" -ne 0 ]; then
            {
              echo "develop=false"
              echo "reason=release_blocker"
            } >>"$GITHUB_OUTPUT"
            echo "A release-blocker issue is open; product development remains frozen." \\
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one exact product gate block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          mkdir -p "$RUNNER_TEMP/release-freeze-gate/.github/workflows"
          cp .github/workflows/hourly-product-development.yml \
            "$RUNNER_TEMP/release-freeze-gate/.github/workflows/"
      - name: Upload the reviewed workflow replacement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-freeze-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-freeze-gate/
          if-no-files-found: error
          retention-days: 1
