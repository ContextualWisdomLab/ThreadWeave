name: Export release-freeze workflow blob

on:
  push:
    branches: [ci/pause-development-for-release-blocker]
    paths: [.github/workflows/patch-release-freeze.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: export-release-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out the source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/pause-development-for-release-blocker
          fetch-depth: 1
          persist-credentials: false
      - name: Patch and export the reviewed workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')
          marker = '          if [ "$DRY_RUN" = "true" ]; then\n'
          insertion = (
              '          release_blockers="$(\n'
              '            gh api \\\n'
              '              "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=release-blocker&per_page=1" \\\n'
              "              --jq '[.[] | select(.pull_request == null)] | length'\n"
              '          )"\n'
              '          if [ "$release_blockers" -ne 0 ]; then\n'
              '            {\n'
              '              echo "develop=false"\n'
              '              echo "reason=release_blocker"\n'
              '            } >>"$GITHUB_OUTPUT"\n'
              '            echo "A release-blocker issue is open; product development remains frozen." \\\n'
              '              >>"$GITHUB_STEP_SUMMARY"\n'
              '            exit 0\n'
              '          fi\n\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('expected one exact dry-run gate')
          path.write_text(text.replace(marker, insertion + marker), encoding='utf-8')
          PY
          encoded="$(base64 -w0 .github/workflows/hourly-product-development.yml)"
          blob_sha="$(
            jq -n --arg content "$encoded" '{content: $content, encoding: "base64"}' |
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/git/blobs" \
                --input - \
                --jq '.sha'
          )"
          body="<!-- release-freeze-workflow-blob --> head=${GITHUB_SHA} blob=${blob_sha}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/18/comments" \
            -f body="$body"
