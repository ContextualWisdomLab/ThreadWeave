name: Apply PR 20 cyclic snapshot hardening

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/apply-pr20-cycle-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-cycle-hardening
  cancel-in-progress: false

jobs:
  red-green-verify:
    if: >-
      github.event.pull_request.number == 20 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/incremental-thread-index'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Prove the cyclic-container regression fails before the fix
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test "$(git hash-object src/threadweave/incremental.py)" = \
            'd5a851bd835bfa1b6acc00b7ac20608e6abeb4f9'
          set +e
          timeout 2s python - <<'PY'
          from threadweave import IncrementalThreadIndex

          cycle = {}
          cycle["self"] = cycle
          IncrementalThreadIndex.restore(cycle)
          PY
          red_status="$?"
          set -e
          if [ "$red_status" -ne 124 ]; then
            echo "Expected the pre-fix restore call to time out; status=$red_status" >&2
            exit 1
          fi
          echo 'Observed the expected pre-fix non-terminating traversal.' \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Apply the minimal iterative cycle detector and regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/test_incremental_snapshot.py)" = \
            '9020bd2953811ebcb814cc0aeaf7f1035e4992e2'
          test "$(git hash-object CHANGELOG.md)" = \
            'a93e06da23a04c9a4d484c8478283be075771aa8'
          test "$(git hash-object docs/incremental-threading.md)" = \
            'd72b48dbeeb4f64a4c78b58151775a010b1b4d1a'
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/threadweave/incremental.py')
          source = source_path.read_text(encoding='utf-8')
          old_source = '''    pending = [value]
              while pending:
                  current = pending.pop()
                  if type(current) is dict:
                      pending.extend(dict.values(current))
                  elif type(current) is list:
                      pending.extend(current)
                  elif current is None or isinstance(current, (str, int, float, bool)):
                      continue
                  else:
                      raise IncrementalThreadError(
                          "snapshot must contain only plain JSON containers and scalar values"
                      )
          '''
          new_source = '''    pending = [(value, False)]
              active_containers: set[int] = set()
              while pending:
                  current, exiting = pending.pop()
                  if type(current) in {dict, list}:
                      identity = id(current)
                      if exiting:
                          active_containers.remove(identity)
                          continue
                      if identity in active_containers:
                          raise IncrementalThreadError(
                              "snapshot must not contain cyclic JSON containers"
                          )
                      active_containers.add(identity)
                      pending.append((current, True))
                      children = dict.values(current) if type(current) is dict else current
                      pending.extend((child, False) for child in children)
                  elif current is None or isinstance(current, (str, int, float, bool)):
                      continue
                  else:
                      raise IncrementalThreadError(
                          "snapshot must contain only plain JSON containers and scalar values"
                      )
          '''
          if source.count(old_source) != 1:
              raise SystemExit('unexpected plain-container guard source state')
          source_path.write_text(source.replace(old_source, new_source), encoding='utf-8')

          test_path = Path('tests/test_incremental_snapshot.py')
          tests = test_path.read_text(encoding='utf-8')
          import_anchor = 'import pytest\n\n'
          if 'import threadweave.incremental as incremental_module\n' not in tests:
              if tests.count(import_anchor) != 1:
                  raise SystemExit('unexpected snapshot test import state')
              tests = tests.replace(
                  import_anchor,
                  'import pytest\nimport threadweave.incremental as incremental_module\n\n',
              )
          test_name = 'def test_plain_container_guard_rejects_cycles_and_allows_shared_values():'
          if test_name in tests:
              raise SystemExit('cycle regression test already exists')
          tests += '''

          def test_plain_container_guard_rejects_cycles_and_allows_shared_values():
              """The iterative guard distinguishes cycles from shared acyclic values."""
              mapping_cycle: dict[str, object] = {}
              mapping_cycle["self"] = mapping_cycle
              with pytest.raises(IncrementalThreadError, match="cyclic"):
                  IncrementalThreadIndex.restore(mapping_cycle)

              list_cycle: list[object] = []
              list_cycle.append(list_cycle)
              nested_cycle = {
                  "schema_version": 1,
                  "version": 0,
                  "options": {
                      "group_by_subject": False,
                      "sort_by_sent_date": False,
                  },
                  "records": list_cycle,
              }
              with pytest.raises(IncrementalThreadError, match="cyclic"):
                  IncrementalThreadIndex.restore(nested_cycle)

              shared: list[object] = [{"value": 1}]
              incremental_module._require_plain_json_containers(
                  {"first": shared, "second": shared}
              )
          '''
          test_path.write_text(tests, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog_anchor = '''## Unreleased

          - Reject dictionary and list subclasses at the incremental snapshot restore
          '''
          changelog_replacement = '''## Unreleased

          - Reject cyclic built-in dictionaries and lists at the incremental snapshot
            restore boundary without recursion or unbounded traversal.
          - Reject dictionary and list subclasses at the incremental snapshot restore
          '''
          if changelog.count(changelog_anchor) != 1:
              raise SystemExit('unexpected CHANGELOG state')
          changelog_path.write_text(
              changelog.replace(changelog_anchor, changelog_replacement),
              encoding='utf-8',
          )

          docs_path = Path('docs/incremental-threading.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs_anchor = '''subclasses are rejected before serialization so hostile ``items`` or iterator
          overrides cannot execute inside the restore boundary.
          '''
          docs_replacement = '''subclasses are rejected before serialization so hostile ``items`` or iterator
          overrides cannot execute inside the restore boundary. Cyclic built-in containers
          are detected with an iterative active-path guard and fail without recursion or
          unbounded traversal; repeated acyclic references remain valid JSON input.
          '''
          if docs.count(docs_anchor) != 1:
              raise SystemExit('unexpected incremental documentation state')
          docs_path.write_text(
              docs.replace(docs_anchor, docs_replacement),
              encoding='utf-8',
          )
          PY

      - name: Verify the fixed repository state
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pytest -q tests/test_incremental_snapshot.py \
            -k plain_container_guard_rejects_cycles
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Commit the verified product update
        shell: bash
        run: |
          set -euo pipefail
          rm tools/pr20-cycle-test.patch tools/pr20-cycle-fix.patch
          rmdir tools 2>/dev/null || true
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow changes with the repository token.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix: reject cyclic incremental snapshots iteratively'
          git push origin HEAD:feature/incremental-thread-index
