name: Apply PR 20 cyclic snapshot hardening

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/apply-pr20-cycle-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-cycle-hardening
  cancel-in-progress: false

jobs:
  red-green-verify:
    if: >-
      github.event.pull_request.number == 20 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/incremental-thread-index'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Prove the cyclic-container regression fails before the fix
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'a1190b493a362ac3c9b0d26b8138e67c6f211be3a2fe16b3fde3e8e0afbf7ca7' \
            'tools/pr20-cycle-test.patch' | sha256sum -c -
          git apply --check tools/pr20-cycle-test.patch
          git apply tools/pr20-cycle-test.patch
          set +e
          pytest -q tests/test_incremental_snapshot.py \
            -k restore_rejects_cyclic_plain_containers_without_hanging
          red_status="$?"
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo 'The regression test unexpectedly passed before the fix.' >&2
            exit 1
          fi
          echo 'Observed the expected pre-fix timeout/failure.' >>"$GITHUB_STEP_SUMMARY"

      - name: Apply the minimal iterative cycle detector
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '59631c36acee10ca16359acb51041659f00b9a586515881ecd2129b440dd4b51' \
            'tools/pr20-cycle-fix.patch' | sha256sum -c -
          git apply --check tools/pr20-cycle-fix.patch
          git apply tools/pr20-cycle-fix.patch

      - name: Verify the fixed repository state
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pytest -q tests/test_incremental_snapshot.py \
            -k 'cyclic_plain_containers or plain_container_guard'
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Commit the verified product update
        shell: bash
        run: |
          set -euo pipefail
          rm tools/pr20-cycle-test.patch tools/pr20-cycle-fix.patch
          rmdir tools 2>/dev/null || true
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow changes with the repository token.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix: reject cyclic incremental snapshots iteratively'
          git push origin HEAD:feature/incremental-thread-index
