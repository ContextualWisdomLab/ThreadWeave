name: Ensure PR 20 delta memory evidence

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/ensure-pr20-delta-memory-evidence.yml

permissions:
  contents: write

concurrency:
  group: ensure-pr20-delta-memory-evidence
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Add the failing benchmark contract when absent
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'delta_transient_peak_bytes' benchmarks/incremental_mailbox.py; then
            echo 'already_applied=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'already_applied=false' >>"$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_incremental_benchmark.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert result["incremental"]["delta_apply_seconds"] >= 0
              assert result["incremental"]["peak_rss_bytes"] > 0
          '''
          new = '''    assert result["incremental"]["delta_apply_seconds"] >= 0
              assert result["incremental"]["delta_retained_bytes"] >= 0
              assert result["incremental"]["delta_transient_peak_bytes"] >= 0
              assert result["incremental"]["peak_rss_bytes"] > 0
          '''
          if text.count(old) != 1:
              raise SystemExit('benchmark assertion anchor is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          set +e
          PYTHONPATH=src pytest -q \
            tests/test_incremental_benchmark.py::test_small_benchmark_proves_projection_parity_and_reports_resources \
            >"$RUNNER_TEMP/delta-memory-red.log" 2>&1
          red_status="$?"
          set -e
          cat "$RUNNER_TEMP/delta-memory-red.log"
          if [ "$red_status" -eq 0 ]; then
            echo 'Expected the memory evidence contract to fail before implementation.' >&2
            exit 1
          fi
          if ! grep -Eq 'delta_retained_bytes|delta_transient_peak_bytes' \
            "$RUNNER_TEMP/delta-memory-red.log"; then
            echo 'The RED failure did not come from the missing memory fields.' >&2
            exit 1
          fi

      - name: Implement bounded delta allocation evidence when absent
        if: steps.contract.outputs.already_applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('benchmarks/incremental_mailbox.py')
          text = path.read_text(encoding='utf-8')
          old = '''import argparse
          import hashlib
          import json
          import resource
          import subprocess
          import sys
          '''
          new = '''import argparse
          import gc
          import hashlib
          import json
          import resource
          import subprocess
          import sys
          import tracemalloc
          '''
          if text.count(old) != 1:
              raise SystemExit('benchmark import anchor is not unique')
          text = text.replace(old, new)
          old = '''    bridge = _bridge_record(thread_size)
              started = perf_counter()
              delta = index.apply(
                  MailboxChangeSet(expected_version=1, additions=(bridge,))
              )
              delta_seconds = perf_counter() - started

              started = perf_counter()
          '''
          new = '''    bridge = _bridge_record(thread_size)
              gc.collect()
              tracemalloc.start()
              baseline_current, _ = tracemalloc.get_traced_memory()
              started = perf_counter()
              delta = index.apply(
                  MailboxChangeSet(expected_version=1, additions=(bridge,))
              )
              delta_seconds = perf_counter() - started
              current_bytes, peak_bytes = tracemalloc.get_traced_memory()
              tracemalloc.stop()

              started = perf_counter()
          '''
          if text.count(old) != 1:
              raise SystemExit('benchmark delta anchor is not unique')
          text = text.replace(old, new)
          old = '''        "delta_apply_seconds": delta_seconds,
                  "materialize_seconds": materialize_seconds,
                  "peak_rss_bytes": _peak_rss_bytes(),
          '''
          new = '''        "delta_apply_seconds": delta_seconds,
                  "delta_retained_bytes": current_bytes - baseline_current,
                  "delta_transient_peak_bytes": peak_bytes - baseline_current,
                  "materialize_seconds": materialize_seconds,
                  "peak_rss_bytes": _peak_rss_bytes(),
          '''
          if text.count(old) != 1:
              raise SystemExit('benchmark result anchor is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('docs/incremental-threading.md')
          text = path.read_text(encoding='utf-8')
          old = '''RSS, affected-message count, and full-view materialization time. The scheduled/manual
          workflow defaults to 100,000 existing messages and stores the JSON evidence for 90
          '''
          new = '''RSS, affected-message count, delta retained/transient traced bytes, and full-view
          materialization time. The scheduled/manual workflow defaults to 100,000 existing
          messages and stores the JSON evidence for 90
          '''
          if text.count(old) != 1:
              raise SystemExit('incremental documentation anchor is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''and records affected-message count, wall time, and peak RSS as JSON evidence.
          '''
          new = '''and records affected-message count, wall time, delta retained/transient traced
          bytes, and peak RSS as JSON evidence.
          '''
          if text.count(old) != 1:
              raise SystemExit('README benchmark anchor is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          old = '''message count, root count, and peak RSS. Scheduled evidence defaults to 100,000
          existing messages. Focused performance contracts additionally reject default-mode
          '''
          new = '''message count, root count, delta retained/transient traced bytes, and peak RSS.
          Scheduled evidence defaults to 100,000 existing messages. Focused performance
          contracts additionally reject default-mode
          '''
          if text.count(old) != 1:
              raise SystemExit('architecture benchmark anchor is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '''- Record retained and transient traced allocation for each isolated incremental
            benchmark delta so scheduled 100,000-message evidence detects mailbox-wide
            copying regressions alongside wall time, affected-message count, and peak RSS.
          '''
          if entry not in text:
              anchor = '## Unreleased\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit('CHANGELOG anchor is not unique')
              text = text.replace(anchor, anchor + entry, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify the focused benchmark contract
        shell: bash
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_incremental_benchmark.py

      - name: Verify exact 100,000-message evidence
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python benchmarks/incremental_mailbox.py \
            --messages 100000 \
            --thread-size 10 \
            --output "$RUNNER_TEMP/incremental-benchmark.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path(os.environ['RUNNER_TEMP'], 'incremental-benchmark.json').read_text(
                  encoding='utf-8'
              )
          )
          incremental = result['incremental']
          full_rebuild = result['full_rebuild']
          if incremental['projection_sha256'] != full_rebuild['projection_sha256']:
              raise SystemExit('projection digest mismatch')
          if incremental['affected_message_count'] != 21:
              raise SystemExit('unexpected affected-message count')
          if incremental['delta_transient_peak_bytes'] >= 1_000_000:
              raise SystemExit('delta transient allocation exceeds the 1 MB contract')
          with open(
              os.environ['GITHUB_STEP_SUMMARY'],
              'a',
              encoding='utf-8',
          ) as summary:
              summary.write('## Exact 100,000-message delta evidence\n\n')
              summary.write('```json\n')
              summary.write(json.dumps(result, indent=2, sort_keys=True))
              summary.write('\n```\n')
          PY

      - name: Verify the complete repository
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Publish the verified product state and remove the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ensure-pr20-delta-memory-evidence.yml
          git diff --check
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No product or cleanup commit required.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'perf: retain incremental delta allocation evidence'
          git push origin HEAD:feature/incremental-thread-index
