# Temporary trusted finalizer. It deletes itself after the verified push commit.
name: Finalize verifier source-layout import

on:
  push:
    branches: [supply-chain/hash-locked-ci]
    paths: [.github/workflows/finalize-reverify-pythonpath.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: finalize-reverify-pythonpath-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out the source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: supply-chain/hash-locked-ci
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Apply the source-layout regression fix
        run: python scripts/ci/patch_reverify_pythonpath.py
      - name: Install the reviewed lock
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Verify the complete repository from source layout
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts
          pytest -q tests/test_workflows.py
          pytest -q
          python -m build --no-isolation
          python -m pip check
          git diff --check
      - name: Exchange OIDC identity for a scoped repository app token
        id: repository_app
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          [ -n "$oidc_token" ]
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          [ -n "$app_token" ]
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"
      - name: Commit the verified fix and remove bootstrap code
        env:
          APP_TOKEN: ${{ steps.repository_app.outputs.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-reverify-pythonpath.yml \
            scripts/ci/patch_reverify_pythonpath.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve source-layout imports in independent verification"
          git push \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF}"
