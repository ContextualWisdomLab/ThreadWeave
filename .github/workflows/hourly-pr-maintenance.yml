name: Hourly PR Maintenance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print planned actions without mutating pull requests
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "11 * * * *"

concurrency:
  group: hourly-pr-maintenance-${{ github.repository }}
  cancel-in-progress: false

# The pinned organization-central merge scheduler already performs bounded
# current-head review dispatch, exact-head check evaluation, branch updates,
# and policy-compliant merge evaluation. The caller therefore forwards no
# repository secrets and keeps its default token read-only.
permissions:
  contents: read

jobs:
  review-merge:
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
      statuses: read
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@3f65dbee6672b78802e7d71d49c390f3817bb03b
    with:
      base_branch: "main"
      branch_update_limit: "1"
      dry_run: ${{ inputs.dry_run || false }}
      enable_auto_merge: true
      max_prs: "20"
      merge_mode: "direct_or_auto"
      project_flow: "github-flow"
      review_dispatch_limit: "1"
      stale_opencode_minutes: "60"
      trigger_reviews: true
      update_branches: true
