name: Finalize PR 20 bounded state overlays

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/finalize-pr20-bounded-state-overlays.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-bounded-state-overlays
  cancel-in-progress: false

jobs:
  verify-and-clean:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Ensure the bounded overlay product patch is present
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^class _OverlayMapping' src/threadweave/incremental.py; then
            echo 'Product patch already present.' >>"$GITHUB_STEP_SUMMARY"
          elif [ -f tools/pr20-bounded-state-overlays.patch ]; then
            git apply --check tools/pr20-bounded-state-overlays.patch
            git apply tools/pr20-bounded-state-overlays.patch
            echo 'Product patch applied by finalizer.' >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'Bounded overlay implementation and patch are both missing.' >&2
            exit 1
          fi
          git diff --check

      - name: Verify focused product behavior
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_incremental_private_graph.py \
            tests/test_incremental_rfc8474.py \
            tests/test_incremental_components.py \
            tests/test_incremental_parity.py \
            tests/test_incremental_concurrency.py

      - name: Verify bounded 100,000-message default delta allocations
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import gc
          import json
          import os
          import time
          import tracemalloc

          from threadweave import (
              IncrementalThreadIndex,
              IndexedMessage,
              MailboxChangeSet,
              Message,
          )

          message_count = 100_000
          records = tuple(
              IndexedMessage(
                  f"key_{index}",
                  Message(message_id=f"message_{index}"),
              )
              for index in range(message_count)
          )
          index = IncrementalThreadIndex()
          index.apply(MailboxChangeSet(expected_version=0, additions=records))
          gc.collect()
          tracemalloc.start()
          baseline_current, _ = tracemalloc.get_traced_memory()
          started = time.perf_counter()
          delta = index.apply(
              MailboxChangeSet(
                  expected_version=1,
                  replacements=(
                      IndexedMessage(
                          "key_0",
                          Message(message_id="message_0", subject="updated"),
                      ),
                  ),
              )
          )
          elapsed_seconds = time.perf_counter() - started
          current_bytes, peak_bytes = tracemalloc.get_traced_memory()
          tracemalloc.stop()
          transient_peak_bytes = peak_bytes - baseline_current
          retained_bytes = current_bytes - baseline_current
          if delta.affected_message_keys != ("key_0",):
              raise SystemExit(delta.affected_message_keys)
          if transient_peak_bytes >= 1_000_000:
              raise SystemExit(
                  f"default delta allocated {transient_peak_bytes} transient bytes"
              )
          evidence = {
              "message_count": message_count,
              "affected_message_count": len(delta.affected_message_keys),
              "delta_apply_seconds": elapsed_seconds,
              "retained_delta_bytes": retained_bytes,
              "transient_peak_delta_bytes": transient_peak_bytes,
          }
          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("## Bounded default delta evidence\n\n")
              summary.write("```json\n")
              summary.write(json.dumps(evidence, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PYCODE

      - name: Verify the complete repository
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Remove one-shot assets and publish the verified branch state
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            tools/pr20-bounded-state-overlays.patch \
            .github/workflows/apply-pr20-bounded-state-overlays.yml \
            .github/workflows/finalize-pr20-bounded-state-overlays.yml
          rmdir tools 2>/dev/null || true
          git diff --check
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup commit required.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'ci: finalize bounded incremental state overlays'
          git push origin HEAD:feature/incremental-thread-index
