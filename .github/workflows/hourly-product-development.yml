name: Hourly Product Development

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate the gate and prompt without running the agent
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: hourly-product-development-${{ github.repository }}
  cancel-in-progress: false

# The default token is read-only; only the single job that pushes the agent's
# branch and opens the pull request elevates to write. The coding agent itself
# runs inside that job as an OpenCode session against NVIDIA NIM,
# authenticated only by the NVIDIA_NIM_API_KEY organization secret. No Copilot
# subscription, Agent Tasks API, or fine-grained user token is involved.
permissions:
  contents: read

jobs:
  develop-product-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
    env:
      # The scoped NVIDIA_NIM_API_KEY organization secret is the only NIM
      # credential source. opencode.json expects that same value in
      # NVIDIA_API_KEY.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      DEFAULT_BRANCH: main
      DRY_RUN: ${{ inputs.dry_run || false }}
      REPOSITORY_TOKEN: ${{ github.token }}
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia-nim/nvidia/nemotron-3-super-120b-a12b
        nvidia-nim/deepseek-ai/deepseek-v4-pro
      OPENCODE_RUN_TIMEOUT_SECONDS: "2400"
    steps:
      - name: Enforce pull-request-first single-flight gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            {
              echo "dispatch=false"
              echo "reason=nim_api_key_unavailable"
            } >>"$GITHUB_OUTPUT"
            cat >>"$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Autonomous development is disabled because `NVIDIA_NIM_API_KEY` is not configured.
          Configure the organization secret so the in-workflow OpenCode agent can reach
          NVIDIA NIM. No Copilot subscription or user token is required.
          SUMMARY
            exit 0
          fi

          open_prs="$(
            GH_TOKEN="$REPOSITORY_TOKEN" gh pr list \
              --repo "$GITHUB_REPOSITORY" --state open --limit 1 --json number,url
          )"
          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            {
              echo "dispatch=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "Open pull request exists; the maintenance loop owns this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "dispatch=true"
            echo "reason=ready"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded commercial-quality task
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/threadweave-agent-prompt.md" <<'PROMPT'
          Continue product development for ContextualWisdomLab/ThreadWeave.

          Read AGENTS.md, README.md, CHANGELOG.md, docs/research, the current source,
          tests, open issues, and recent merged pull requests before choosing work.
          Identify the single highest-value buyer-visible product or reliability gap
          that can be completed as one reviewable increment. Prefer correctness,
          standards conformance, direct mailbox-ingestion usability, deterministic
          behavior, performance on large mailboxes, stable integration APIs, and
          release safety over cosmetic work.

          Work test-first. Reproduce the gap with a failing test, implement the
          smallest coherent fix or feature, and preserve loop safety and deterministic
          ordering. Keep the runtime pure standard library unless an unavoidable,
          explicitly justified product requirement says otherwise. Maintain 100% production
          statement and branch coverage and complete production docstrings.
          Update CHANGELOG.md and all user/research documentation affected by the
          behavior. Verify lint, compileall, doctests, the full test suite, coverage,
          package build, installed-wheel smoke tests, and security-sensitive edge cases.

          Respect the repository's standalone-plus-module architecture and keep public
          APIs usable both directly and from naruon. Do not merge, publish, or bypass
          reviews. Leave the working tree holding one bounded increment and write
          PR_MESSAGE.md at the repository root: the title on the first line, then a
          body with evidence, standards citations when relevant, explicit residual
          risks, and no unrelated refactoring. This workflow packages your working
          tree as exactly one bounded pull request against main. If a release is
          genuinely ready, use semantic versioning and update CHANGELOG.md; otherwise
          leave the version unchanged.
          PROMPT

      - name: Record dry-run decision
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN == 'true'
        shell: bash
        run: |
          echo "Dry run: a bounded product-development agent session would start." \
            >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/threadweave-agent-prompt.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Check out the default branch without persisted credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Install the pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${HOME}/.opencode/bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/opencode" "${install_dir}/opencode"
          "${install_dir}/opencode" --version
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Configure OpenCode for NVIDIA NIM
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG
          echo "/opencode.json" >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - name: Run the NVIDIA NIM development agent
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          prompt="$(cat "$RUNNER_TEMP/threadweave-agent-prompt.md")"
          status=1
          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::opencode $model"
            if timeout --kill-after=30s "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              echo "Agent session completed with \`$model\`." >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Model $model failed; discarding partial work and trying the next candidate."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD
            git -C "$GITHUB_WORKSPACE" clean -fd
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA NIM model candidate failed; no work was proposed."
            exit 1
          fi

      - name: Open exactly one bounded pull request
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          rm -f opencode.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "The agent made no changes; nothing to propose this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="ThreadWeave autonomous product increment"
          body_file="$RUNNER_TEMP/pr-body.md"
          if [ -f PR_MESSAGE.md ]; then
            candidate_title="$(head -n 1 PR_MESSAGE.md | sed 's/^#\+ *//')"
            [ -n "$candidate_title" ] && title="$candidate_title"
            tail -n +2 PR_MESSAGE.md >"$body_file"
            rm -f PR_MESSAGE.md
          else
            echo "Autonomous NVIDIA NIM increment; see the diff and CHANGELOG.md." \
              >"$body_file"
          fi

          branch="nim-agent/product-dev-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          )"
          {
            echo "Opened bounded pull request: $pr_url"
            echo "The PR-maintenance workflow owns review, repair, revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
