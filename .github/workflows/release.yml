name: Release ThreadWeave

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional recovery version; must match reviewed project metadata
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - pyproject.toml
      - src/threadweave/__init__.py
      - scripts/ci/release_contract.py
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_BUNDLE_NAME: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  release-readiness:
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      publisher_available: ${{ steps.contract.outputs.publisher_available }}
      public_version_exists: ${{ steps.contract.outputs.public_version_exists }}
    steps:
      - name: Harden the release-readiness gate
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the exact integrated release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve release version and publisher readiness
        id: contract
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          PIPY_TOKEN_AVAILABLE: ${{ secrets.PIPY_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_PROTECTED" != "true" ]; then
            echo "::error::Release must run from a branch protected by rules or branch protection."
            exit 1
          fi

          release_version="$(python3 - <<'PY'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]
          version = project["version"]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) is None:
              raise SystemExit("project version must be canonical MAJOR.MINOR.PATCH")
          print(version)
          PY
          )"

          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$release_version" ]; then
            echo "::error::Requested version does not match the reviewed project version."
            exit 1
          fi

          response="$RUNNER_TEMP/pypi-version.json"
          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$response" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/threadweave/$release_version/json"
          )"
          case "$status" in
            404)
              public_version_exists=false
              if [ "$PIPY_TOKEN_AVAILABLE" != "true" ]; then
                echo "::error::PIPY_TOKEN is unavailable for a new PyPI release."
                exit 1
              fi
              ;;
            200)
              public_version_exists=true
              ;;
            *)
              echo "::error::Unexpected PyPI readiness response: HTTP $status."
              exit 1
              ;;
          esac

          {
            printf 'version=%s\n' "$release_version"
            printf 'tag=v%s\n' "$release_version"
            printf 'publisher_available=%s\n' "$PIPY_TOKEN_AVAILABLE"
            printf 'public_version_exists=%s\n' "$public_version_exists"
          } >>"$GITHUB_OUTPUT"

  build-release:
    needs: release-readiness
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.release-readiness.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release-readiness.outputs.version }}
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      release_date: ${{ steps.contract.outputs.release_date }}
    steps:
      - name: Harden the release builder
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the reviewed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install the pinned lock compiler
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Install the reviewed release toolchain
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Reproduce the reviewed dependency lock
        run: |
          set -euo pipefail
          regenerated="$(mktemp)"
          bash scripts/ci/compile_ci_lock.sh "$regenerated"
          cmp --silent requirements/ci.lock "$regenerated"
      - name: Repeat the complete quality contract
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py
          coverage_include="scripts/ci/hourly_product_guard.py"
          coverage_include+=",scripts/ci/nim_proxy.py"
          coverage_include+=",scripts/ci/release_contract.py"
          coverage report \
            --include="$coverage_include" \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report
          python -m pip check
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Prepare deterministic release evidence
        id: contract
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          mkdir -p "$bundle/dist"
          cp dist/* "$bundle/dist/"
          python scripts/ci/release_contract.py prepare \
            --root . \
            --version "$RELEASE_VERSION" \
            --dist-dir "$bundle/dist" \
            --output-dir "$bundle/release" \
            --github-output "$GITHUB_OUTPUT"
      - name: Hash-install and smoke-test the reviewed wheel
        env:
          PYTHONPATH: ""
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          wheel_path="$(realpath "$(find "$bundle/dist" -maxdepth 1 -name '*.whl' -print -quit)")"
          wheel_sha="$(sha256sum "$wheel_path" | awk '{print $1}')"
          requirements_file="$RUNNER_TEMP/threadweave-release-wheel.txt"
          printf 'threadweave @ file://%s \\\n    --hash=sha256:%s\n' \
            "$wheel_path" "$wheel_sha" >"$requirements_file"
          python -m pip install \
            --require-hashes \
            --no-deps \
            --no-index \
            --force-reinstall \
            -r "$requirements_file"
          temp_dir="$(mktemp -d)"
          (
            cd "$temp_dir"
            python - <<'PY'
          import os

          import threadweave
          from threadweave import Message, serialize_thread_response, thread_messages

          assert threadweave.__version__ == os.environ["RELEASE_VERSION"]
          roots = thread_messages(
              [
                  Message(message_id="root", sequence_number=1, uid=101),
                  Message(
                      message_id="child",
                      references=["root"],
                      sequence_number=2,
                      uid=102,
                  ),
              ]
          )
          assert serialize_thread_response(roots) == "* THREAD (1 2)\r\n"
          assert serialize_thread_response(roots, identifier="uid") == (
              "* THREAD (101 102)\r\n"
          )
          PY
          )
      - name: Confirm release preparation did not mutate reviewed source
        run: git diff --exit-code
      - name: Upload the immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          retention-days: 7

  publication-plan:
    needs: [release-readiness, build-release]
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.build-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
      PUBLISHER_AVAILABLE: ${{ needs.release-readiness.outputs.publisher_available }}
    outputs:
      publication_required: ${{ steps.plan.outputs.publication_required }}
      missing_filenames: ${{ steps.plan.outputs.missing_filenames }}
    steps:
      - name: Harden the publication planner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the reviewed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Compare public artifacts and prepare only missing distributions
        id: plan
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pypi-version.json"
          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$response" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/threadweave/$RELEASE_VERSION/json"
          )"
          PYPI_STATUS="$status" python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          runner = Path(os.environ["RUNNER_TEMP"])
          bundle = runner / "release-bundle"
          manifest = bundle / "release" / "SHA256SUMS.txt"
          expected: dict[str, str] = {}
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              name = filename.lstrip("* ")
              if name in expected:
                  raise SystemExit(f"duplicate expected artifact: {name}")
              expected[name] = digest

          status = os.environ["PYPI_STATUS"]
          if status == "404":
              observed: dict[str, str] = {}
          elif status == "200":
              payload = json.loads((runner / "pypi-version.json").read_text(encoding="utf-8"))
              observed = {}
              for item in payload.get("urls", []):
                  name = item["filename"]
                  if name in observed:
                      raise SystemExit(f"duplicate public artifact: {name}")
                  observed[name] = item["digests"]["sha256"]
          else:
              raise SystemExit(f"unexpected PyPI planning response: HTTP {status}")

          unexpected = sorted(set(observed) - set(expected))
          if unexpected:
              raise SystemExit(f"unexpected public artifact: {unexpected!r}")
          for name, digest in observed.items():
              if digest != expected[name]:
                  raise SystemExit(
                      f"public artifact digest mismatch for {name}: "
                      f"expected {expected[name]}, observed {digest}"
                  )

          missing = sorted(set(expected) - set(observed))
          if missing and os.environ["PUBLISHER_AVAILABLE"] != "true":
              raise SystemExit(
                  "approved PyPI publisher is unavailable while distributions are missing"
              )

          publish_dir = runner / "publication-missing"
          if publish_dir.exists():
              shutil.rmtree(publish_dir)
          if missing:
              publish_dir.mkdir()
              for name in missing:
                  source = bundle / "dist" / name
                  if not source.is_file():
                      raise SystemExit(f"reviewed artifact is missing from bundle: {name}")
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  if digest != expected[name]:
                      raise SystemExit(f"reviewed artifact digest mismatch before plan: {name}")
                  shutil.copyfile(source, publish_dir / name)

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"publication_required={'true' if missing else 'false'}\n")
              stream.write(
                  "missing_filenames="
                  + json.dumps(missing, separators=(",", ":"))
                  + "\n"
              )
          PY
      - name: Upload only missing PyPI distributions
        if: steps.plan.outputs.publication_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-missing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-missing/
          if-no-files-found: error
          retention-days: 7

  attest-release:
    needs: [build-release, publication-plan]
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.publication-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden the attestation job
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            oauth2.sigstore.dev:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the reviewed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Verify distribution checksums
        run: |
          cd "$RUNNER_TEMP/release-bundle/dist"
          sha256sum --check ../release/SHA256SUMS.txt
      - name: Attest SLSA build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/release-bundle/dist/*
      - name: Attest the SPDX release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/release-bundle/dist/*
          sbom-path: ${{ runner.temp }}/release-bundle/release/threadweave-${{ needs.build-release.outputs.version }}.spdx.json

  tag-release:
    needs: [build-release, publication-plan, attest-release]
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.publication-plan.result == 'success' &&
      needs.attest-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
      RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
    steps:
      - name: Harden the tag job
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the reviewed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the reviewed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Verify the tag target and create it idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-bundle/dist"
          sha256sum --check ../release/SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          tag_object="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          peeled_commit="$(
            git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" |
              awk '{print $1}'
          )"
          if [ -n "$tag_object" ]; then
            if [ -z "$peeled_commit" ] || [ "$peeled_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release tag is not an annotated tag for this commit."
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "ThreadWeave $RELEASE_VERSION"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git push origin "$RELEASE_TAG"

  github-release:
    needs: [build-release, publication-plan, attest-release, tag-release]
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.publication-plan.result == 'success' &&
      needs.tag-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
      RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
    steps:
      - name: Harden the GitHub Release job
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the reviewed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          (
            cd "$bundle/dist"
            sha256sum --check ../release/SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_notes="$RUNNER_TEMP/existing-release-notes.md"
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq .body >"$existing_notes"
            diff --strip-trailing-cr "$bundle/release/release-notes.md" "$existing_notes"

            expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
            observed_assets="$RUNNER_TEMP/observed-release-assets.txt"
            {
              find "$bundle/dist" -maxdepth 1 -type f -printf '%f\n'
              printf '%s\n' \
                SHA256SUMS.txt \
                "threadweave-$RELEASE_VERSION.spdx.json"
            } | sort >"$expected_assets"
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | sort >"$observed_assets"
            cmp "$expected_assets" "$observed_assets"

            verification="$RUNNER_TEMP/existing-release-assets"
            mkdir "$verification"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$verification"
            cmp "$bundle/release/SHA256SUMS.txt" "$verification/SHA256SUMS.txt"
            cmp "$bundle/release/threadweave-$RELEASE_VERSION.spdx.json" \
              "$verification/threadweave-$RELEASE_VERSION.spdx.json"
            (
              cd "$verification"
              sha256sum --check SHA256SUMS.txt
            )
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "$bundle/dist/"* \
            "$bundle/release/SHA256SUMS.txt" \
            "$bundle/release/threadweave-$RELEASE_VERSION.spdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ThreadWeave $RELEASE_VERSION" \
            --notes-file "$bundle/release/release-notes.md" \
            --latest

  publish-pypi:
    needs: [build-release, publication-plan, attest-release, tag-release, github-release]
    if: >-
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.github-release.result == 'success' &&
      needs.publication-plan.outputs.publication_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the PyPI publishing job
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            upload.pypi.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the reviewed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Download only missing distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-missing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-missing
      - name: Verify missing distributions immediately before publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          runner = Path(os.environ["RUNNER_TEMP"])
          bundle = runner / "release-bundle"
          publish_dir = runner / "publication-missing"
          expected: dict[str, str] = {}
          for line in (bundle / "release" / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              expected[filename.lstrip("* ")] = digest
          files = sorted(path for path in publish_dir.iterdir() if path.is_file())
          if not files:
              raise SystemExit("publication plan required upload but supplied no distributions")
          for path in files:
              if path.name not in expected:
                  raise SystemExit(f"unreviewed publication artifact: {path.name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected[path.name]:
                  raise SystemExit(f"publication artifact digest mismatch: {path.name}")
          PY
      - name: Publish only missing distributions through the approved PyPI API token
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ${{ runner.temp }}/publication-missing/
          password: ${{ secrets.PIPY_TOKEN }}
          attestations: false
          print-hash: true

  verify-publication:
    needs: [build-release, publication-plan, github-release, publish-pypi]
    if: >-
      always() &&
      github.repository == 'ContextualWisdomLab/ThreadWeave' &&
      github.ref == 'refs/heads/main' &&
      needs.build-release.result == 'success' &&
      needs.publication-plan.result == 'success' &&
      needs.github-release.result == 'success' &&
      (needs.publish-pypi.result == 'success' ||
       needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - name: Harden public-artifact verification
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            files.pythonhosted.org:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the reviewed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Verify PyPI filenames and SHA-256 digests
        run: |
          set -euo pipefail
          pypi_json="$RUNNER_TEMP/threadweave-pypi.json"
          curl --fail --silent --show-error --location \
            --output "$pypi_json" \
            "https://pypi.org/pypi/threadweave/$RELEASE_VERSION/json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-bundle"
          expected: dict[str, str] = {}
          for line in (root / "release" / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              expected[filename.lstrip("* ")] = digest
          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "threadweave-pypi.json").read_text(
                  encoding="utf-8"
              )
          )
          observed = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload["urls"]
          }
          if observed != expected:
              raise SystemExit(
                  f"PyPI artifact digest set disagrees with reviewed release bundle: "
                  f"expected={expected!r} observed={observed!r}"
              )
          PY
      - name: Clean-install the public package and smoke THREAD serialization
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/public-install"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            "threadweave==${RELEASE_VERSION}"
          temp_dir="$(mktemp -d)"
          (
            cd "$temp_dir"
            PYTHONPATH="" "$venv/bin/python" - <<'PY'
          import os

          import threadweave
          from threadweave import Message, serialize_thread_response, thread_messages

          assert threadweave.__version__ == os.environ["RELEASE_VERSION"]
          roots = thread_messages(
              [
                  Message(message_id="root", sequence_number=1, uid=101),
                  Message(
                      message_id="child",
                      references=["root"],
                      sequence_number=2,
                      uid=102,
                  ),
              ]
          )
          assert serialize_thread_response(roots) == "* THREAD (1 2)\r\n"
          assert serialize_thread_response(roots, identifier="uid") == (
              "* THREAD (101 102)\r\n"
          )
          PY
          )
