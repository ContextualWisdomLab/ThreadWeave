name: Apply PR 20 ordering review fix

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/apply-pr20-ordering-review-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-ordering-review-fix
  cancel-in-progress: false

jobs:
  verify-and-apply:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Apply the review fix against the exact blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/test_incremental_snapshot.py)" = \
            '1303ed9d760a022b093e52ca34b22363e655ed5d'
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_incremental_snapshot.py")
          text = path.read_text(encoding="utf-8")
          old = '''class _HostileString(str):
              """String subclass whose comparison must not run during sorted encoding."""

              def __lt__(self, _other: object) -> bool:
                  """Raise if JSON key sorting reaches attacker-controlled comparison."""
                  raise RuntimeError("hostile string comparison")
          '''
          new = '''class _HostileString(str):
              """String subclass whose comparisons must not run during sorted encoding."""

              def __lt__(self, _other: object) -> bool:
                  """Reject less-than comparison if sorted encoding reaches this key."""
                  raise TypeError("hostile string comparison")

              def __le__(self, _other: object) -> bool:
                  """Reject less-than-or-equal comparison if encoding reaches this key."""
                  raise TypeError("hostile string comparison")

              def __gt__(self, _other: object) -> bool:
                  """Reject greater-than comparison if sorted encoding reaches this key."""
                  raise TypeError("hostile string comparison")

              def __ge__(self, _other: object) -> bool:
                  """Reject greater-than-or-equal comparison if encoding reaches this key."""
                  raise TypeError("hostile string comparison")
          '''
          if text.count(old) != 1:
              raise SystemExit("unexpected hostile-string test state")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Verify the complete repository
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pytest -q tests/test_incremental_snapshot.py
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Commit the verified review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_incremental_snapshot.py
          git diff --cached --check
          git commit -m 'test: complete hostile ordering protocol'
          git push origin HEAD:feature/incremental-thread-index
