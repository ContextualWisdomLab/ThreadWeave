name: Apply PR 20 snapshot expansion hardening

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/apply-pr20-snapshot-expansion-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-snapshot-expansion-hardening
  cancel-in-progress: false

jobs:
  red-green-verify:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Verify the reviewed baseline and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/threadweave/incremental.py)" = \
            'aed1af878c829704cdc3a9f6e539b53f5cb50aa5'
          test "$(git hash-object tests/test_incremental_snapshot.py)" = \
            '4eafaec5ed305886bc44805ac8791b052d8ee8ce'
          test "$(git hash-object docs/incremental-threading.md)" = \
            '16f129afb1f53571004fdb76aa1241d88c0e1f4c'
          test "$(git hash-object README.md)" = \
            '8f839a24cb608dea83ac9197a669c3cff4f57c74'
          test "$(git hash-object CHANGELOG.md)" = \
            '8c8290df7f076e872f1597c28134fc45bcc85242'
          test "$(git hash-object tools/pr20-snapshot-expansion-hardening.patch)" = \
            '2e9fa6de4b5da5c344efaaecaf4ea5d45b80564b'
          git apply --check tools/pr20-snapshot-expansion-hardening.patch

      - name: Prove the regressions fail before implementation
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail

          set +e
          timeout 2s python - <<'PY'
          from threadweave import IncrementalThreadIndex

          compact_graph = []
          for _ in range(28):
              compact_graph = [compact_graph, compact_graph]
          IncrementalThreadIndex.restore(
              {
                  "schema_version": 1,
                  "version": 0,
                  "options": {
                      "group_by_subject": False,
                      "sort_by_sent_date": False,
                  },
                  "records": compact_graph,
              },
              max_snapshot_bytes=128,
          )
          PY
          expansion_status="$?"
          set -e
          if [ "$expansion_status" -ne 124 ]; then
            echo "Expected compact graph expansion to time out; status=$expansion_status" >&2
            exit 1
          fi

          set +e
          python - <<'PY' >"$RUNNER_TEMP/hostile-key-red.log" 2>&1
          from threadweave import IncrementalThreadIndex

          class HostileString(str):
              def __lt__(self, _other):
                  raise RuntimeError("hostile string comparison executed")

          IncrementalThreadIndex.restore(
              {
                  "schema_version": 1,
                  HostileString("unexpected"): 1,
              }
          )
          PY
          hostile_status="$?"
          set -e
          cat "$RUNNER_TEMP/hostile-key-red.log"
          if [ "$hostile_status" -eq 0 ] || \
             ! grep -q 'hostile string comparison executed' \
               "$RUNNER_TEMP/hostile-key-red.log"; then
            echo 'Expected sorted encoding to execute the hostile comparison.' >&2
            exit 1
          fi
          echo 'Observed both expected pre-fix failures.' >>"$GITHUB_STEP_SUMMARY"

      - name: Apply the bounded snapshot fix
        shell: bash
        run: |
          set -euo pipefail
          git apply tools/pr20-snapshot-expansion-hardening.patch
          rm tools/pr20-snapshot-expansion-hardening.patch
          rmdir tools 2>/dev/null || true
          git diff --check

      - name: Verify the fixed repository state
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pytest -q tests/test_incremental_snapshot.py \
            -k 'plain_json_guard or reused_containers or size_validation'
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Commit the verified product update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/threadweave/incremental.py \
            tests/test_incremental_snapshot.py \
            docs/incremental-threading.md \
            README.md \
            CHANGELOG.md
          git add -u tools/pr20-snapshot-expansion-hardening.patch
          git diff --cached --check
          git commit -m 'fix: bound incremental snapshot expansion'
          git push origin HEAD:feature/incremental-thread-index
