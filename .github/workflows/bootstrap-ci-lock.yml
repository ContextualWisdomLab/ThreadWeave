# Temporary trusted finalizer. Remove after applying the verified artifact.
name: Finalize hash-lock migration

on:
  push:
    branches: [supply-chain/hash-locked-ci]
    paths: [.github/workflows/bootstrap-ci-lock.yml]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-ci-lock.yml
      - scripts/ci/apply_hash_lock_migration.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalize-hash-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out the source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: supply-chain/hash-locked-ci
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Apply the deterministic migration
        run: python scripts/ci/apply_hash_lock_migration.py
      - name: Install the reviewed lock
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Verify the complete migration
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts
          pytest -q tests/test_dependency_lock_contract.py tests/test_workflows.py
          pytest -q
          python -m build --no-isolation
          python -m pip check
          git diff --check
      - name: Preserve the verified migration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-lock-migration-${{ github.sha }}
          path: |
            .github/workflows/hourly-product-development.yml
            tests/test_workflows.py
            README.md
            AGENTS.md
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 3
