name: Finalize hourly workflow validation

on:
  push:
    branches:
      - fix/hourly-product-workflow-validation
    paths:
      - .github/workflows/finalize-hourly-workflow-validation.yml

permissions:
  contents: read

concurrency:
  group: finalize-hourly-workflow-validation
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hourly-product-workflow-validation
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Apply the two reviewed workflow corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')

          indentation_old = (
              "          printf 'threadweave @ file://%s \\\n"
              "    --hash=sha256:%s\\n' \\\n"
          )
          indentation_new = (
              "          printf 'threadweave @ file://%s \\\n"
              "            --hash=sha256:%s\\n' \\\n"
          )
          if text.count(indentation_old) != 1:
              raise SystemExit('unexpected wheel requirement indentation state')
          text = text.replace(indentation_old, indentation_new)

          nested_shell = (
              '            if timeout --kill-after=30s '
              '"${OPENCODE_RUN_TIMEOUT_SECONDS}s" \\\n'
          )
          nested_shell_fixed = (
              '            # shellcheck disable=SC2016\n'
              + nested_shell
          )
          if text.count(nested_shell) != 1:
              raise SystemExit('unexpected nested shell state')
          path.write_text(
              text.replace(nested_shell, nested_shell_fixed),
              encoding='utf-8',
          )
          PY

      - name: Verify workflow syntax and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -color=false .github/workflows/*.yml
          pytest -q tests/test_workflows.py
          ruff check .
          git diff --check

      - name: Commit verified corrections and remove this one-shot workflow
        shell: bash
        env:
          AUTOMATION_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AUTOMATION_TOKEN:-}" ]; then
            echo "::error::PR_REVIEW_MERGE_TOKEN or OPENCODE_APPROVE_TOKEN is required."
            exit 1
          fi
          rm .github/workflows/finalize-hourly-workflow-validation.yml
          git diff --check
          git config user.name "ThreadWeave verification bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/hourly-product-development.yml \
            .github/workflows/finalize-hourly-workflow-validation.yml
          git commit -m "fix: restore hourly product workflow validation"
          basic="$(printf 'x-access-token:%s' "$AUTOMATION_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git push origin HEAD:fix/hourly-product-workflow-validation
