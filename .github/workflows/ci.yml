name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # Pin ruff: an unpinned "latest" broke every branch when a new release
      # changed the default rule set.
      - run: python -m pip install -e ".[test]" "ruff==0.15.20"
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - name: Run production doctests
        run: |
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
      - name: Require complete autonomous-boundary coverage
        env:
          COVERAGE_FILE: .coverage.autonomous
        run: |
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_nim_proxy.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py \
            --fail-under=100 \
            --show-missing
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          source_archives = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(source_archives) == 1, source_archives

          with zipfile.ZipFile(wheels[0]) as archive:
              assert "threadweave/py.typed" in archive.namelist()

          with tarfile.open(source_archives[0]) as archive:
              assert any(
                  name.endswith("/src/threadweave/py.typed")
                  for name in archive.getnames()
              )
          PY
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed wheel outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          python - <<'PY'
          from threadweave import Message, thread_messages

          roots = thread_messages(
              [
                  Message(
                      message_id="later@example.com",
                      sent_date="2 Jan 2026 00:00:00 +0000",
                  ),
                  Message(
                      message_id="earlier@example.com",
                      sent_date="1 Jan 2026 00:00:00 +0000",
                  ),
              ],
              sort_by_sent_date=True,
          )
          assert [root.message.message_id for root in roots] == [
              "earlier@example.com",
              "later@example.com",
          ]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadweave-distributions
          path: dist/
          if-no-files-found: error
