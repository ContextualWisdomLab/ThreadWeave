name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" ruff
      - run: ruff check .
      - run: python -m compileall -q src tests
      - run: python -m doctest src/threadweave/headers.py src/threadweave/subject.py
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          source_archives = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(source_archives) == 1, source_archives

          with zipfile.ZipFile(wheels[0]) as archive:
              assert "threadweave/py.typed" in archive.namelist()

          with tarfile.open(source_archives[0]) as archive:
              assert any(
                  name.endswith("/src/threadweave/py.typed")
                  for name in archive.getnames()
              )
          PY
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed wheel outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          python - <<'PY'
          from threadweave import Message, thread_messages

          roots = thread_messages(
              [
                  Message(message_id="root@example.com"),
                  Message(
                      message_id="child@example.com",
                      references="<root@example.com>",
                  ),
              ]
          )
          assert len(roots) == 1
          assert roots[0].message.message_id == "root@example.com"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: threadweave-distributions
          path: dist/
          if-no-files-found: error
