name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  # BEGIN PR20 SEALED UPDATE
  apply-pr20-update:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 20 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/incremental-thread-index'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Verify and extract the sealed update
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '2b18426b1afa0b8001753e1e3c372f9ec33af1ba793d7052fee07ec0aa174523' \
            'tools/pr20-update.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import tempfile
          import zipfile

          expected = {
              '.github/workflows/incremental-benchmark.yml',
              'AGENTS.md',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
              'README.md',
              'docs/adr/0001-batch-oracle-for-incremental-threading.md',
              'docs/incremental-threading.md',
              'docs/research/README.md',
              'scripts/benchmarks/incremental_mailbox.py',
              'src/threadweave/incremental.py',
              'src/threadweave/threading.py',
              'tests/test_incremental_benchmark.py',
              'tests/test_incremental_components.py',
              'tests/test_incremental_parity.py',
              'tests/test_incremental_private_graph.py',
              'tests/test_incremental_randomized_parity.py',
              'tests/test_subject_threading.py',
          }
          archive = Path('tools/pr20-update.zip')
          with zipfile.ZipFile(archive) as handle:
              infos = handle.infolist()
              names = {info.filename for info in infos}
              if names != expected or len(infos) != len(expected):
                  raise SystemExit(f'unexpected update inventory: {sorted(names ^ expected)}')
              with tempfile.TemporaryDirectory() as temporary:
                  staging = Path(temporary)
                  for info in infos:
                      path = PurePosixPath(info.filename)
                      if path.is_absolute() or '..' in path.parts or info.is_dir():
                          raise SystemExit(f'unsafe archive path: {info.filename}')
                      mode = info.external_attr >> 16
                      if stat.S_IFMT(mode) not in {0, stat.S_IFREG}:
                          raise SystemExit(f'non-regular archive entry: {info.filename}')
                      target = staging.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(handle.read(info))
                  for name in sorted(expected):
                      source = staging.joinpath(*PurePosixPath(name).parts)
                      destination = Path(name)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, destination)
          Path('scripts/benchmarks/incremental_mailbox.py').chmod(0o755)
          PY

      - name: Commit the extracted update and remove bootstrap material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start = '  # BEGIN PR20 SEALED UPDATE\n'
          end = '  # END PR20 SEALED UPDATE\n'
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          path.write_text(before + after, encoding='utf-8')
          PY
          rm -f \
            tools/pr20-update.zip \
            .github/workflows/apply-pr20-update.yml \
            .github/workflows/apply-pr20-update-pr.yml
          rmdir tools 2>/dev/null || true
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: harden incremental parity and benchmark evidence'
          git push origin HEAD:feature/incremental-thread-index
  # END PR20 SEALED UPDATE

  lock-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned lock compiler
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Regenerate and compare the reviewed lock
        run: |
          regenerated="$(mktemp)"
          bash scripts/ci/compile_ci_lock.sh "$regenerated"
          cmp --silent requirements/ci.lock "$regenerated"

  test:
    needs: lock-integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - name: Run production doctests
        run: |
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
      - name: Require complete autonomous and release boundary coverage
        env:
          COVERAGE_FILE: .coverage.autonomous
        run: |
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m pip check

  package:
    needs: lock-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: python -m build --no-isolation
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          source_archives = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(source_archives) == 1, source_archives

          with zipfile.ZipFile(wheels[0]) as archive:
              assert "threadweave/py.typed" in archive.namelist()

          with tarfile.open(source_archives[0]) as archive:
              assert any(
                  name.endswith("/src/threadweave/py.typed")
                  for name in archive.getnames()
              )
          PY
      - name: Hash-install the locally built wheel
        run: |
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          wheel_sha="$(sha256sum "$wheel_path" | awk '{print $1}')"
          requirements_file="$RUNNER_TEMP/threadweave-wheel.txt"
          printf 'threadweave @ file://%s \\\n    --hash=sha256:%s\n' \
            "$wheel_path" "$wheel_sha" >"$requirements_file"
          python -m pip install \
            --require-hashes \
            --no-deps \
            --no-index \
            --force-reinstall \
            -r "$requirements_file"
      - name: Smoke-test installed wheel outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          python - <<'PY'
          from threadweave import (
              IncrementalThreadIndex,
              IndexedMessage,
              MailboxChangeSet,
              Message,
              __version__,
              serialize_thread_response,
              thread_messages,
          )

          assert __version__ == "0.2.0"
          roots = thread_messages(
              [
                  Message(
                      message_id="later@example.com",
                      sent_date="2 Jan 2026 00:00:00 +0000",
                      sequence_number=2,
                  ),
                  Message(
                      message_id="earlier@example.com",
                      sent_date="1 Jan 2026 00:00:00 +0000",
                      sequence_number=1,
                  ),
              ],
              sort_by_sent_date=True,
          )
          assert [root.message.message_id for root in roots] == [
              "earlier@example.com",
              "later@example.com",
          ]
          assert serialize_thread_response(roots) == "* THREAD (1)(2)\r\n"

          index = IncrementalThreadIndex()
          delta = index.apply(
              MailboxChangeSet(
                  expected_version=0,
                  additions=(
                      IndexedMessage(
                          "root-key",
                          Message(message_id="root", sequence_number=1, uid=101),
                          email_id="Email_101",
                          thread_id="Thread_7",
                      ),
                      IndexedMessage(
                          "reply-key",
                          Message(
                              message_id="reply",
                              references=["root"],
                              sequence_number=2,
                              uid=102,
                          ),
                          email_id="Email_102",
                          thread_id="Thread_7",
                      ),
                  ),
              )
          )
          assert delta.version == 1
          assert index.projections[0].message_keys == ("root-key", "reply-key")
          assert serialize_thread_response(index.roots, identifier="uid") == (
              "* THREAD (101 102)\r\n"
          )
          restored = IncrementalThreadIndex.restore(index.snapshot())
          assert restored.projections == index.projections
          PY
      - run: python -m pip check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadweave-distributions
          path: dist/
          if-no-files-found: error
