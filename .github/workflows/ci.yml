name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: src

jobs:
  lock-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Lint every GitHub Actions workflow
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "$release_url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -color=false .github/workflows/*.yml
      - name: Install the pinned lock compiler
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Regenerate and compare the reviewed lock
        run: |
          regenerated="$(mktemp)"
          bash scripts/ci/compile_ci_lock.sh "$regenerated"
          cmp --silent requirements/ci.lock "$regenerated"

  test:
    needs: lock-integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - name: Run production doctests
        run: |
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
      - name: Require complete autonomous and release boundary coverage
        env:
          COVERAGE_FILE: .coverage.autonomous
        run: |
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_actions_registry_audit.py \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_hourly_product_secret_fingerprint.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/actions_registry_audit.py,scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py,scripts/ci/secret_fingerprint_guard.py \
            --fail-under=100 \
            --show-missing
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m pip check

  package:
    needs: lock-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: python -m build --no-isolation
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          source_archives = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(source_archives) == 1, source_archives

          with zipfile.ZipFile(wheels[0]) as archive:
              assert "threadweave/py.typed" in archive.namelist()

          with tarfile.open(source_archives[0]) as archive:
              assert any(
                  name.endswith("/src/threadweave/py.typed")
                  for name in archive.getnames()
              )
          PY
      - name: Hash-install the locally built wheel
        run: |
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          wheel_sha="$(sha256sum "$wheel_path" | awk '{print $1}')"
          requirements_file="$RUNNER_TEMP/threadweave-wheel.txt"
          printf 'threadweave @ file://%s \
            --hash=sha256:%s\n' \
            "$wheel_path" "$wheel_sha" >"$requirements_file"
          python -m pip install \
            --require-hashes \
            --no-deps \
            --no-index \
            --force-reinstall \
            -r "$requirements_file"
      - name: Smoke-test installed wheel outside the source tree
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          python - <<'PY'
          from threadweave import (
              Message,
              __version__,
              serialize_thread_response,
              thread_messages,
          )

          assert __version__ == "0.2.0"
          roots = thread_messages(
              [
                  Message(
                      message_id="later@example.com",
                      sent_date="2 Jan 2026 00:00:00 +0000",
                      sequence_number=2,
                  ),
                  Message(
                      message_id="earlier@example.com",
                      sent_date="1 Jan 2026 00:00:00 +0000",
                      sequence_number=1,
                  ),
              ],
              sort_by_sent_date=True,
          )
          assert [root.message.message_id for root in roots] == [
              "earlier@example.com",
              "later@example.com",
          ]
          assert serialize_thread_response(roots) == "* THREAD (1)(2)\r\n"
          PY
      - run: python -m pip check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadweave-distributions
          path: dist/
          if-no-files-found: error
