name: Diagnose hourly product workflow

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/diagnose-hourly-product-workflow.yml

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Diagnose the hourly product-development workflow
        shell: bash
        run: |
          set -o pipefail
          "${RUNNER_TEMP}/actionlint" \
            -color never \
            .github/workflows/hourly-product-development.yml \
            2>&1 | tee "${RUNNER_TEMP}/actionlint-output.txt"
