name: Repair PR 20 bounded overlay patch

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/repair-pr20-bounded-patch.yml

permissions:
  contents: write

concurrency:
  group: repair-pr20-bounded-overlay-patch
  cancel-in-progress: false

jobs:
  repair-and-retrigger:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Recalculate every unified-diff hunk count and validate the patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/pr20-bounded-state-overlays.patch)" = \
            '58f0da771cfc692f863d0d8381080f92574ae1bf'
          test "$(git hash-object .github/workflows/apply-pr20-bounded-state-overlays.yml)" = \
            '0d1eb08d4425db241b1de8704134f261f418d5c7'
          python - <<'PYCODE'
          from __future__ import annotations

          import re
          from pathlib import Path

          patch_path = Path("tools/pr20-bounded-state-overlays.patch")
          lines = patch_path.read_text(encoding="utf-8").splitlines(keepends=True)
          header_pattern = re.compile(
              r"^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*?)(\n)?$"
          )
          repaired: list[str] = []
          index = 0
          repaired_hunks = 0
          while index < len(lines):
              line = lines[index]
              match = header_pattern.match(line)
              if match is None:
                  repaired.append(line)
                  index += 1
                  continue

              body_start = index + 1
              body_end = body_start
              while body_end < len(lines):
                  candidate = lines[body_end]
                  if candidate.startswith("@@ ") or candidate.startswith("diff --git "):
                      break
                  body_end += 1

              body = lines[body_start:body_end]
              old_count = sum(
                  1 for body_line in body if body_line.startswith((" ", "-"))
              )
              new_count = sum(
                  1 for body_line in body if body_line.startswith((" ", "+"))
              )
              suffix = match.group(3)
              newline = match.group(4) or ""
              repaired.append(
                  f"@@ -{match.group(1)},{old_count} "
                  f"+{match.group(2)},{new_count} @@{suffix}{newline}"
              )
              repaired.extend(body)
              repaired_hunks += 1
              index = body_end

          if repaired_hunks < 10:
              raise SystemExit(f"unexpected hunk count: {repaired_hunks}")
          patch_path.write_text("".join(repaired), encoding="utf-8")

          apply_path = Path(
              ".github/workflows/apply-pr20-bounded-state-overlays.yml"
          )
          workflow = apply_path.read_text(encoding="utf-8")
          marker = "# corrected-patch-trigger-v2\n"
          if marker in workflow:
              raise SystemExit("existing apply workflow already contains repair marker")
          apply_path.write_text(workflow + "\n" + marker, encoding="utf-8")
          PYCODE
          git apply --check tools/pr20-bounded-state-overlays.patch
          rm .github/workflows/repair-pr20-bounded-patch.yml
          git diff --check

      - name: Commit the repaired patch and retrigger product verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/pr20-bounded-state-overlays.patch \
            .github/workflows/apply-pr20-bounded-state-overlays.yml
          git add -u .github/workflows/repair-pr20-bounded-patch.yml
          git diff --cached --check
          git commit -m 'ci: repair bounded overlay patch metadata'
          git push origin HEAD:feature/incremental-thread-index
