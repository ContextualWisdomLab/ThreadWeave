name: Repair and apply PR 20 bounded state overlays

on:
  push:
    branches:
      - feature/incremental-thread-index
    paths:
      - .github/workflows/repair-pr20-bounded-patch.yml

permissions:
  contents: write

concurrency:
  group: repair-pr20-bounded-state-overlays
  cancel-in-progress: false

jobs:
  red-green-verify-and-apply:
    if: github.repository == 'ContextualWisdomLab/ThreadWeave'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Recalculate every unified-diff hunk count and validate the patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/threadweave/incremental.py)" = \
            '674d0978648c90d81e35a845b441fa367bb424d2'
          test "$(git hash-object tests/test_incremental_private_graph.py)" = \
            '325ce7a1b07a7f0cf6674bcde93e03d5aa6e5fd6'
          test "$(git hash-object CHANGELOG.md)" = \
            '78cec06aee3d679b8fe2d19f801de64ee7117ed3'
          test "$(git hash-object README.md)" = \
            '648b017a8ceebe28db8739419541d7d4a1482d6e'
          test "$(git hash-object docs/incremental-threading.md)" = \
            'e0851f170870542030fff2ef34c71763e38e969d'
          test "$(git hash-object ARCHITECTURE.md)" = \
            'e7c1badd6155e85b83729236723e30e6487d2b4e'
          test "$(git hash-object tools/pr20-bounded-state-overlays.patch)" = \
            '58f0da771cfc692f863d0d8381080f92574ae1bf'
          python - <<'PYCODE'
          from __future__ import annotations

          import re
          from pathlib import Path

          patch_path = Path("tools/pr20-bounded-state-overlays.patch")
          lines = patch_path.read_text(encoding="utf-8").splitlines(keepends=True)
          header_pattern = re.compile(
              r"^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*?)(\n)?$"
          )
          repaired: list[str] = []
          index = 0
          repaired_hunks = 0
          while index < len(lines):
              line = lines[index]
              match = header_pattern.match(line)
              if match is None:
                  repaired.append(line)
                  index += 1
                  continue

              body_start = index + 1
              body_end = body_start
              while body_end < len(lines):
                  candidate = lines[body_end]
                  if candidate.startswith("@@ ") or candidate.startswith("diff --git "):
                      break
                  body_end += 1

              body = lines[body_start:body_end]
              old_count = sum(
                  1 for body_line in body if body_line.startswith((" ", "-"))
              )
              new_count = sum(
                  1 for body_line in body if body_line.startswith((" ", "+"))
              )
              repaired.append(
                  f"@@ -{match.group(1)},{old_count} "
                  f"+{match.group(2)},{new_count} @@"
                  f"{match.group(3)}{match.group(4) or ''}"
              )
              repaired.extend(body)
              repaired_hunks += 1
              index = body_end

          if repaired_hunks < 10:
              raise SystemExit(f"unexpected hunk count: {repaired_hunks}")
          patch_path.write_text("".join(repaired), encoding="utf-8")
          PYCODE
          git apply --check tools/pr20-bounded-state-overlays.patch

      - name: Prove default updates scan unrelated state before the fix
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from threadweave import (
              IncrementalThreadIndex,
              IndexedMessage,
              MailboxChangeSet,
              Message,
          )

          class NoFullIterationDict(dict):
              def __iter__(self):
                  raise AssertionError("unexpected full-state iteration")

              def keys(self):
                  raise AssertionError("unexpected full-state key scan")

              def items(self):
                  raise AssertionError("unexpected full-state item scan")

              def values(self):
                  raise AssertionError("unexpected full-state value scan")

          records = tuple(
              IndexedMessage(
                  f"message_{index}",
                  Message(message_id=f"message_{index}"),
              )
              for index in range(256)
          )
          index = IncrementalThreadIndex()
          index.apply(MailboxChangeSet(expected_version=0, additions=records))
          for name in (
              "_records",
              "_positions",
              "_tokens_by_key",
              "_keys_by_token",
              "_component_by_key",
              "_keys_by_component",
          ):
              setattr(index, name, NoFullIterationDict(getattr(index, name)))

          try:
              index.apply(
                  MailboxChangeSet(
                      expected_version=1,
                      replacements=(
                          IndexedMessage(
                              "message_0",
                              Message(message_id="message_0", subject="updated"),
                          ),
                      ),
                  )
              )
          except AssertionError as error:
              if "full-state" not in str(error):
                  raise
          else:
              raise SystemExit("expected the pre-fix delta to scan unrelated state")
          PYCODE
          echo 'Observed the expected pre-fix mailbox-wide state scan.' \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Apply the bounded transaction overlay patch
        shell: bash
        run: |
          set -euo pipefail
          git apply tools/pr20-bounded-state-overlays.patch
          rm tools/pr20-bounded-state-overlays.patch
          rmdir tools 2>/dev/null || true
          git diff --check

      - name: Verify focused state, identity, component, and RFC behavior
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_incremental_private_graph.py \
            tests/test_incremental_rfc8474.py \
            tests/test_incremental_components.py \
            tests/test_incremental_parity.py \
            tests/test_incremental_concurrency.py

      - name: Verify 100,000-message default delta allocations are bounded
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import gc
          import json
          import os
          import time
          import tracemalloc

          from threadweave import (
              IncrementalThreadIndex,
              IndexedMessage,
              MailboxChangeSet,
              Message,
          )

          message_count = 100_000
          records = tuple(
              IndexedMessage(
                  f"key_{index}",
                  Message(message_id=f"message_{index}"),
              )
              for index in range(message_count)
          )
          index = IncrementalThreadIndex()
          index.apply(MailboxChangeSet(expected_version=0, additions=records))
          gc.collect()
          tracemalloc.start()
          baseline_current, _ = tracemalloc.get_traced_memory()
          started = time.perf_counter()
          delta = index.apply(
              MailboxChangeSet(
                  expected_version=1,
                  replacements=(
                      IndexedMessage(
                          "key_0",
                          Message(message_id="message_0", subject="updated"),
                      ),
                  ),
              )
          )
          elapsed_seconds = time.perf_counter() - started
          current_bytes, peak_bytes = tracemalloc.get_traced_memory()
          tracemalloc.stop()
          transient_peak_bytes = peak_bytes - baseline_current
          retained_bytes = current_bytes - baseline_current
          if delta.affected_message_keys != ("key_0",):
              raise SystemExit(delta.affected_message_keys)
          if transient_peak_bytes >= 1_000_000:
              raise SystemExit(
                  f"default delta allocated {transient_peak_bytes} transient bytes"
              )
          evidence = {
              "message_count": message_count,
              "affected_message_count": len(delta.affected_message_keys),
              "delta_apply_seconds": elapsed_seconds,
              "retained_delta_bytes": retained_bytes,
              "transient_peak_delta_bytes": transient_peak_bytes,
          }
          print(json.dumps(evidence, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Bounded default delta evidence\n\n")
              summary.write("```json\n")
              summary.write(json.dumps(evidence, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PYCODE

      - name: Verify randomized canonical parity
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import random

          from threadweave import (
              IncrementalThreadIndex,
              IndexedMessage,
              MailboxChangeSet,
              Message,
              thread_messages,
          )

          def projection(roots):
              result = []
              for root in roots:
                  keys = []
                  seen = set()
                  stack = [root]
                  while stack:
                      node = stack.pop()
                      if id(node) in seen:
                          continue
                      seen.add(id(node))
                      if node.message is not None:
                          keys.append(node.message.payload)
                      stack.extend(reversed(node.children))
                  result.append(tuple(keys))
              return tuple(result)

          transition_count = 0
          subjects = (None, "Topic", "Re: Topic", "Ｔｏｐｉｃ", "Other")
          dates = (
              None,
              "1 Jan 2026 00:00:00 +0000",
              "2 Jan 2026 09:00:00 +0900",
              "bad date",
          )
          for group_by_subject in (False, True):
              for sort_by_sent_date in (False, True):
                  for seed in range(4):
                      source = random.Random(
                          801_000
                          + seed
                          + (100 if group_by_subject else 0)
                          + (1_000 if sort_by_sent_date else 0)
                      )
                      index = IncrementalThreadIndex(
                          group_by_subject=group_by_subject,
                          sort_by_sent_date=sort_by_sent_date,
                      )
                      records = {}
                      ordered_keys = []
                      next_key = 0
                      for step in range(160):
                          roll = source.random()
                          if not records or roll < 0.48:
                              key = f"seed_{seed}_message_{next_key}"
                              next_key += 1
                              operation = "add"
                          elif roll < 0.78:
                              key = source.choice(ordered_keys)
                              operation = "replace"
                          else:
                              key = source.choice(ordered_keys)
                              operation = "remove"

                          if operation != "remove":
                              existing_ids = [
                                  record.message.message_id
                                  for record in records.values()
                                  if record.message.message_id is not None
                              ]
                              mode = source.randrange(6)
                              if mode == 0:
                                  message_id = None
                              elif mode == 1 and existing_ids:
                                  message_id = source.choice(existing_ids)
                              else:
                                  message_id = f"{key}@example.test"
                              candidates = existing_ids + [
                                  f"missing_{item}@example.test"
                                  for item in range(3)
                              ]
                              references = (
                                  tuple(
                                      source.choice(candidates)
                                      for _ in range(source.randrange(3))
                                  )
                                  if candidates
                                  else ()
                              )
                              record = IndexedMessage(
                                  key,
                                  Message(
                                      message_id=message_id,
                                      references=references,
                                      subject=source.choice(subjects),
                                      sent_date=source.choice(dates),
                                      payload=key,
                                  ),
                                  email_id=f"Email_{key}",
                                  thread_id=f"Thread_{key}",
                              )

                          if operation == "add":
                              change = MailboxChangeSet(
                                  index.version,
                                  additions=(record,),
                              )
                              records[key] = record
                              ordered_keys.append(key)
                          elif operation == "replace":
                              change = MailboxChangeSet(
                                  index.version,
                                  replacements=(record,),
                              )
                              records[key] = record
                          else:
                              change = MailboxChangeSet(
                                  index.version,
                                  removals=(key,),
                              )
                              del records[key]
                              ordered_keys.remove(key)

                          index.apply(change)
                          expected = projection(
                              thread_messages(
                                  (records[key].message for key in ordered_keys),
                                  group_by_subject=group_by_subject,
                                  sort_by_sent_date=sort_by_sent_date,
                              )
                          )
                          observed = tuple(
                              item.message_keys for item in index.projections
                          )
                          if observed != expected:
                              raise SystemExit(
                                  (group_by_subject, sort_by_sent_date, seed, step)
                              )
                          transition_count += 1
          print(f"validated {transition_count} randomized transitions")
          PYCODE

      - name: Verify the complete repository
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Commit only verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/threadweave/incremental.py \
            tests/test_incremental_private_graph.py \
            CHANGELOG.md \
            README.md \
            docs/incremental-threading.md \
            ARCHITECTURE.md
          git add -u tools/pr20-bounded-state-overlays.patch
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to publish workflow changes from the one-shot verifier.' >&2
            exit 1
          fi
          git commit -m 'perf: bound default incremental state updates'
          git push origin HEAD:feature/incremental-thread-index
