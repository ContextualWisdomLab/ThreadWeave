name: Apply PR 20 plain JSON hardening

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/apply-pr20-plain-json-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-plain-json-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.number == 20 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/incremental-thread-index'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '7b3a7a72b804d8b4c71d0129ca0096da64b37d97da1a29989fd8f355199112f1' \
            'tools/pr20-plain-json-hardening.patch' | sha256sum -c -
          git apply --check tools/pr20-plain-json-hardening.patch
          git apply tools/pr20-plain-json-hardening.patch

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Verify the patched repository state
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check

      - name: Commit the verified product update
        shell: bash
        run: |
          set -euo pipefail
          rm tools/pr20-plain-json-hardening.patch
          rmdir tools 2>/dev/null || true
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow changes with the repository token.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix: reject executable snapshot container subclasses'
          git push origin HEAD:feature/incremental-thread-index
