name: Apply PR 20 verified update

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/apply-pr20-update-pr.yml

permissions:
  contents: write

concurrency:
  group: apply-pr20-update-pr
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 20 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/incremental-thread-index'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/incremental-thread-index
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Reassemble, verify, apply, and repair the reviewed patch
        shell: bash
        env:
          PR20_PATCH: ${{ runner.temp }}/pr20-review-fixes.patch
        run: |
          set -euo pipefail
          cat tools/pr20-review-fixes.part-* >"$PR20_PATCH"
          printf '%s  %s\n' \
            '14216e3eac0bee274542e487caf06984f36741ceb81bf8bfcd5428a9dbd69c41' \
            "$PR20_PATCH" | sha256sum -c -
          git apply --check "$PR20_PATCH"
          git apply "$PR20_PATCH"
          python - <<'PY'
          from pathlib import Path

          source = Path('src/threadweave/incremental.py')
          source_text = source.read_text(encoding='utf-8')
          obsolete = 'from threadweave.dates import normalize_sent_date\n'
          if source_text.count(obsolete) != 1:
              raise SystemExit('unexpected normalize_sent_date import state')
          source.write_text(source_text.replace(obsolete, ''), encoding='utf-8')

          tests = Path('tests/test_incremental_components.py')
          test_text = tests.read_text(encoding='utf-8')
          anchor = 'from __future__ import annotations\n\n'
          if 'import pytest\n' not in test_text:
              if test_text.count(anchor) != 1:
                  raise SystemExit('unexpected incremental component import state')
              test_text = test_text.replace(anchor, anchor + 'import pytest\n\n')
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install the reviewed CI lock
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Verify the patched repository state
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests scripts benchmarks
          python -m doctest \
            src/threadweave/collation.py \
            src/threadweave/dates.py \
            src/threadweave/headers.py \
            src/threadweave/subject.py
          coverage erase
          coverage run --branch --source=scripts/ci -m pytest -q \
            tests/test_autonomous_documentation.py \
            tests/test_dependency_lock_contract.py \
            tests/test_hourly_product_guard.py \
            tests/test_hourly_product_guard_coverage.py \
            tests/test_hourly_product_guard_return.py \
            tests/test_nim_proxy.py \
            tests/test_nim_tls_context.py \
            tests/test_release_contract.py \
            tests/test_release_contract_coverage.py \
            tests/test_release_workflow.py
          coverage report \
            --include=scripts/ci/hourly_product_guard.py,scripts/ci/nim_proxy.py,scripts/ci/release_contract.py \
            --fail-under=100 \
            --show-missing
          coverage erase
          coverage run -m pytest -q
          coverage report --fail-under=100 --show-missing
          python -m build --no-isolation
          python -m pip check
          python benchmarks/incremental_mailbox.py \
            --messages 10000 \
            --thread-size 10 \
            --output "$RUNNER_TEMP/incremental-benchmark.json"

      - name: Commit the verified product update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/incremental-benchmark.yml
          rm -f tools/pr20-update.zip
          rm -f tools/pr20-review-fixes.part-01 tools/pr20-review-fixes.part-02
          rm -f tools/pr20-review-fixes.part-03 tools/pr20-review-fixes.part-04
          rm -f tools/pr20-review-fixes.part-05 tools/pr20-review-fixes.part-06
          rm -f tools/pr20-review-fixes.part-07 tools/pr20-review-fixes.part-08
          rm -f tools/pr20-review-fixes.part-09 tools/pr20-review-fixes.part-10
          rmdir tools 2>/dev/null || true
          git config user.name 'ThreadWeave verification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow changes with the repository token.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'perf: harden incremental mailbox updates'
          git push origin HEAD:feature/incremental-thread-index
