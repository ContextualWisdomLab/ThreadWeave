[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threadweave"
version = "0.1.0"
description = "The canonical JWZ email message-threading algorithm with RFC 5322 identification-field parsing — pure stdlib, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Contextual Wisdom Lab" }]
keywords = [
    "email",
    "threading",
    "jwz",
    "rfc5322",
    "mailbox",
    "conversation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/threadweave"
Repository = "https://github.com/ContextualWisdomLab/threadweave"
Issues = "https://github.com/ContextualWisdomLab/threadweave/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/threadweave"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
